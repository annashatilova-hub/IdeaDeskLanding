<!-- Tilda block: Hero -->
<style>
  .tg-hero-wrap {
    --tg-primary: #1c50de;
    --tg-text: #0f172a;
    --tg-muted: #64748b;
    font-family: 'TildaSans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    width: 100%;
    background: linear-gradient(135deg, #f4f7ff 0%, #e8efff 45%, #dce8ff 100%);
    padding: 64px 24px 80px;
    position: relative;
    overflow: hidden;
  }
  .tg-hero-wrap *, .tg-hero-wrap *::before, .tg-hero-wrap *::after { box-sizing: border-box; }
  .tg-hero-wrap::before {
    content: "";
    position: absolute;
    top: -120px; right: -80px;
    width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(28,80,222,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .tg-hero-inner {
    max-width: 1240px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(280px, 0.82fr) minmax(420px, 1.45fr);
    gap: 32px 28px;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .tg-hero-title {
    margin: 0 0 18px;
    font-size: clamp(32px, 4.2vw, 50px);
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--tg-text);
  }
  .tg-hero-title span {
    background: linear-gradient(135deg, #1c50de 0%, #3b6df0 55%, #5b8af5 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .tg-hero-sub {
    margin: 0 0 28px;
    font-size: 20px;
    line-height: 1.65;
    color: var(--tg-muted);
    max-width: 480px;
  }
  .tg-hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .tg-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: transform .2s, box-shadow .2s;
  }
  .tg-btn-primary {
    background: linear-gradient(135deg, #1c50de 0%, #2f63ea 100%);
    color: #fff !important;
    box-shadow: 0 10px 30px rgba(28,80,222,0.28);
  }
  .tg-btn-primary:hover { transform: translateY(-2px); }
  .tg-btn-secondary {
    background: #fff;
    color: var(--tg-primary);
    border: 1px solid rgba(28,80,222,0.22);
  }

  .tg-hero-laptop-scene {
    display: flex;
    justify-content: center;
    padding: 4px 0 8px;
  }
  .tg-laptop {
    width: 100%;
    max-width: 780px;
    filter: drop-shadow(0 22px 40px rgba(15, 23, 42, 0.16));
  }
  .tg-laptop-lid {
    background: #1c1c1e;
    border-radius: 14px 14px 0 0;
    padding: 14px 12px 0;
    border: 1px solid #2c2c2e;
    border-bottom: none;
  }
  .tg-laptop-camera {
    width: 7px;
    height: 7px;
    margin: 0 auto 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #4b5563 0%, #111827 70%);
  }
  .tg-laptop-display {
    position: relative;
    overflow: hidden;
    background: #f4f6fb;
    border-radius: 4px 4px 0 0;
    aspect-ratio: 16 / 10.2;
  }
  .tg-laptop-display img {
    position: absolute;
    left: 0;
    top: 0;
    width: 168%;
    max-width: none;
    height: auto;
    display: block;
  }
  .tg-laptop-hinge {
    height: 6px;
    background: linear-gradient(180deg, #3f3f46, #18181b);
  }
  .tg-laptop-deck {
    position: relative;
    height: 22px;
    background: linear-gradient(180deg, #e7e7ea 0%, #c9c9cf 45%, #b4b4bb 100%);
    border-radius: 0 0 18px 18px;
    border: 1px solid #c4c4cc;
    border-top: none;
  }
  .tg-laptop-deck::before {
    content: "";
    position: absolute;
    left: -3.5%;
    right: -3.5%;
    top: 0;
    height: 10px;
    background: linear-gradient(180deg, #d8d8de, #b8b8c0);
    border-radius: 0 0 10px 10px;
    box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
  }
  .tg-laptop-deck::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 5px;
    width: 72px;
    height: 5px;
    transform: translateX(-50%);
    background: #9ca3af;
    border-radius: 0 0 4px 4px;
    z-index: 1;
  }

  @media (max-width: 960px) {
    .tg-hero-inner { grid-template-columns: 1fr; gap: 36px; }
    .tg-hero-wrap { padding: 56px 20px 64px; }
    .tg-laptop { max-width: 100%; }
    .tg-laptop-display img { width: 155%; }
  }
  @media (max-width: 560px) {
    .tg-hero-wrap { padding: 64px 18px 72px; }
    .tg-hero-title { font-size: clamp(30px, 8.5vw, 40px); }
    .tg-hero-sub { font-size: 18px; }
    .tg-hero-actions { flex-direction: column; }
    .tg-hero-actions .tg-btn { width: 100%; }
    .tg-laptop-display { aspect-ratio: 16 / 11; }
    .tg-laptop-display img { width: 210%; }
    .tg-laptop-lid { padding: 10px 8px 0; }
  }
</style>

<div class="tg-hero-wrap">
  <div class="tg-hero-inner">
    <div>
      <h1 class="tg-hero-title">Тендеры и закупки<br>в <span>одном сервисе</span></h1>
      <p class="tg-hero-sub">Подключайте агрегаторы и госзакупки — все подходящие торги собираются в одной ленте. Ведите воронку, поставщиков и КП в iStockLink.</p>
      <div class="tg-hero-actions">
        <a href="#popup:demo" class="tg-btn tg-btn-primary">Запросить демо</a>
        <a href="#how" class="tg-btn tg-btn-secondary">Как это работает</a>
      </div>
    </div>

    <div class="tg-hero-laptop-scene">
      <div class="tg-laptop">
        <div class="tg-laptop-lid">
          <div class="tg-laptop-camera"></div>
          <div class="tg-laptop-display">
            <img src="https://kolomoets-netizen.github.io/Link/assets/hero-crm-kanban.png" alt="Канбан-воронка сделок iStockLink">
          </div>
        </div>
        <div class="tg-laptop-hinge"></div>
        <div class="tg-laptop-deck"></div>
      </div>
    </div>
  </div>
</div>
