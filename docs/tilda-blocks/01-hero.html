<!-- iStockLink T123 · 01-hero.html · build 787dee8 · 2026-09-21 -->
<!-- Tilda block: Hero -->
<style>
  .tg-hero-wrap {
    --tg-primary: #1c50de;
    --tg-text: #0f172a;
    --tg-muted: #64748b;
    font-family: 'TildaSans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    width: 100%;
    background: linear-gradient(135deg, #f4f7ff 0%, #e8efff 45%, #dce8ff 100%);
    padding: 72px 24px 88px;
    position: relative;
    overflow: hidden;
  }
  .tg-hero-wrap *, .tg-hero-wrap *::before, .tg-hero-wrap *::after { box-sizing: border-box; }
  .tg-hero-wrap::before {
    content: "";
    position: absolute;
    top: -120px; right: -80px;
    width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(28,80,222,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .tg-hero-inner {
    max-width: 1160px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1.25fr;
    gap: 36px;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .tg-hero-title {
    margin: 0 0 18px;
    font-size: clamp(32px, 4.5vw, 52px);
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--tg-text);
  }
  .tg-hero-title span {
    background: linear-gradient(135deg, #1c50de 0%, #3b6df0 55%, #5b8af5 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .tg-hero-sub {
    margin: 0 0 28px;
    font-size: 20px;
    line-height: 1.65;
    color: var(--tg-muted);
    max-width: 540px;
  }
  .tg-hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .tg-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: transform .2s, box-shadow .2s;
  }
  .tg-btn-primary {
    background: linear-gradient(135deg, #1c50de 0%, #2f63ea 100%);
    color: #fff !important;
    box-shadow: 0 10px 30px rgba(28,80,222,0.28);
  }
  .tg-btn-primary:hover { transform: translateY(-2px); }
  .tg-btn-secondary {
    background: #fff;
    color: var(--tg-primary);
    border: 1px solid rgba(28,80,222,0.22);
  }

  .tg-hero-laptop-scene {
    perspective: 1800px;
    padding: 8px 0 28px;
    display: flex;
    justify-content: center;
  }
  .tg-laptop {
    width: 100%;
    max-width: 640px;
    transform: rotateY(-12deg) rotateX(7deg);
    transform-style: preserve-3d;
    filter: drop-shadow(0 28px 48px rgba(15, 23, 42, 0.18));
  }
  .tg-laptop-screen-shell {
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    border-radius: 16px 16px 0 0;
    padding: 12px 12px 0;
    border: 1px solid #334155;
  }
  .tg-laptop-camera {
    width: 8px;
    height: 8px;
    margin: 0 auto 6px;
    border-radius: 50%;
    background: #334155;
    box-shadow: inset 0 0 0 2px #1e293b, 0 0 0 1px #475569;
  }
  .tg-laptop-display {
    background: #f4f6fb;
    border-radius: 4px 4px 0 0;
    overflow: hidden;
    line-height: 0;
  }
  .tg-laptop-display img {
    display: block;
    width: 100%;
    height: auto;
  }
  .tg-laptop-base {
    height: 14px;
    margin: 0 10%;
    background: linear-gradient(180deg, #cbd5e1, #64748b);
    border-radius: 0 0 12px 12px;
    box-shadow: 0 6px 12px rgba(15, 23, 42, 0.15);
  }
  .tg-laptop-notch {
    width: 18%;
    height: 5px;
    margin: 0 auto 2px;
    background: #475569;
    border-radius: 0 0 4px 4px;
  }

  @media (max-width: 900px) {
    .tg-hero-inner { grid-template-columns: 1fr; gap: 36px; }
    .tg-hero-wrap { padding: 64px 24px 72px; }
    .tg-laptop { transform: rotateY(-6deg) rotateX(4deg); max-width: 100%; }
  }
  @media (max-width: 560px) {
    .tg-hero-wrap { padding: 72px 22px 84px; }
    .tg-hero-title { font-size: clamp(30px, 8.5vw, 40px); }
    .tg-hero-sub { font-size: 18px; }
    .tg-hero-actions { flex-direction: column; }
    .tg-hero-actions .tg-btn { width: 100%; }
    .tg-laptop { transform: none; }
  }
</style>

<div class="tg-hero-wrap">
  <div class="tg-hero-inner">
    <div>
      <h1 class="tg-hero-title">Тендеры и закупки<br>в <span>одном сервисе</span></h1>
      <p class="tg-hero-sub">Подключайте агрегаторы и госзакупки — все подходящие торги собираются в одной ленте. Ведите воронку, поставщиков и КП в iStockLink.</p>
      <div class="tg-hero-actions">
        <a href="#popup:demo" class="tg-btn tg-btn-primary">Запросить демо</a>
        <a href="#how" class="tg-btn tg-btn-secondary">Как это работает</a>
      </div>
    </div>

    <div class="tg-hero-laptop-scene">
      <div class="tg-laptop">
        <div class="tg-laptop-screen-shell">
          <div class="tg-laptop-camera"></div>
          <div class="tg-laptop-display">
            <img src="https://kolomoets-netizen.github.io/Link/assets/hero-crm-kanban.png" alt="Канбан-воронка сделок iStockLink: новые закупки, подача предложения, заключение контракта">
          </div>
        </div>
        <div class="tg-laptop-notch"></div>
        <div class="tg-laptop-base"></div>
      </div>
    </div>
  </div>
</div>
