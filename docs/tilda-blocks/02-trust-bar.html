<style>
  .idesk-trust-wrap {
    box-sizing: border-box;
    width: 100%;
    padding: 22px 20px;
    background: #f5f7fa;
    border-top: 1px solid #dfe4ea;
    border-bottom: 1px solid #dfe4ea;
    font-family: 'TildaSans', Arial, sans-serif;
  }
  .idesk-trust-wrap *, .idesk-trust-wrap *::before, .idesk-trust-wrap *::after { box-sizing: border-box; }
  .idesk-trust-grid {
    max-width: 1160px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.2fr repeat(3, 1fr);
    gap: 20px;
    align-items: center;
  }
  .idesk-trust-title { font-weight: 700; font-size: 16px; color: #1c1f22; margin: 0; }
  .idesk-trust-item { font-size: 13px; color: #5f6870; margin: 0; }
  .idesk-trust-item strong { display: block; font-size: 16px; color: #1c1f22; margin-bottom: 2px; }
  @media (max-width: 768px) {
    .idesk-trust-grid { grid-template-columns: 1fr 1fr; gap: 16px; }
    .idesk-trust-title { grid-column: 1 / -1; }
  }
  @media (max-width: 480px) {
    .idesk-trust-grid { grid-template-columns: 1fr; }
  }
</style>

<div class="idesk-trust-wrap">
  <div class="idesk-trust-grid">
    <p class="idesk-trust-title">От идеи до ассортимента</p>
    <p class="idesk-trust-item"><strong>1. Идеи</strong>Источники, фото и параметры</p>
    <p class="idesk-trust-item"><strong>2. Отбор</strong>Оценка и согласование</p>
    <p class="idesk-trust-item"><strong>3. Модели</strong>Готовы к следующему этапу</p>
  </div>
</div>
