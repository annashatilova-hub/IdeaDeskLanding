<style>
  .v3-offer {
    --v3-ink: #1c1f22;
    --v3-muted: #5f6870;
    --v3-blue: #3669fd;
    --v3-blue-dark: #243046;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
    width: 100%;
    padding: 56px 20px 64px;
    font-family: 'TildaSans', Arial, sans-serif;
    color: var(--v3-ink);
    background: #d3deef;
  }
  .v3-offer *, .v3-offer *::before, .v3-offer *::after { box-sizing: border-box; }
  .v3-offer-leaf {
    position: absolute;
    width: 180px;
    height: 180px;
    color: #b7c8e4;
    pointer-events: none;
  }
  .v3-offer-leaf svg { width: 100%; height: 100%; fill: currentColor; }
  .v3-offer-leaf--left { left: -40px; bottom: -50px; transform: rotate(20deg); }
  .v3-offer-leaf--right { right: -30px; top: -40px; transform: rotate(-30deg); }
  .v3-offer-grid {
    position: relative;
    z-index: 1;
    max-width: 1160px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 0.8fr;
    gap: 28px 32px;
    align-items: center;
  }
  .v3-offer .v3-kicker {
    display: block;
    margin: 0 0 12px;
    padding: 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #2e5ee8;
    background: none;
  }
  .v3-offer .v3-title span { white-space: nowrap; }
  .v3-offer .v3-title {
    margin: 0 0 8px;
    font-size: clamp(26px, 3vw, 34px);
    line-height: 1.15;
    font-weight: 800;
    color: var(--v3-ink);
  }
  .v3-offer .v3-price {
    margin: 0 0 10px;
    font-size: clamp(28px, 3vw, 36px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--v3-ink);
  }
  .v3-offer .v3-price span { font-size: 0.55em; font-weight: 700; }
  .v3-offer .v3-note { margin: 0; max-width: 280px; font-size: 14px; line-height: 1.45; color: var(--v3-muted); }
  .v3-offer .v3-form {
    padding: 0;
    border-radius: 0;
    background: none;
    color: var(--v3-ink);
  }
  .v3-form-status { margin: 12px 0 0; font-size: 14px; line-height: 1.4; color: #243046; }
  .v3-offer .v3-form h3 {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    color: var(--v3-muted);
  }
  .v3-offer .v3-fields {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  .v3-offer .v3-form input {
    width: 100%;
    min-height: 44px;
    margin: 0;
    padding: 11px 14px;
    font: inherit;
    font-size: 14px;
    color: var(--v3-ink);
    background: #fff;
    border: 1px solid #e3e8ef;
    border-radius: 8px;
  }
  .v3-offer .v3-btn {
    display: flex;
    width: min(100%, 220px);
    min-height: 44px;
    margin: 0 auto;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 8px;
    background: var(--v3-blue-dark);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .v3-offer .v3-scribble {
    position: relative;
    margin: 0;
    padding-bottom: 36px;
    font-family: 'Segoe Print', 'Comic Sans MS', cursive;
    font-size: 18px;
    line-height: 1.35;
    color: #3a4558;
  }
  .v3-offer .v3-scribble svg {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 64px;
    height: 28px;
    stroke: #3a4558;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .v3-offer .v3-scribble-arrow--up { display: none; }
  @media (max-width: 900px) {
    .v3-offer-grid { grid-template-columns: 1fr; }
    .v3-offer .v3-fields { grid-template-columns: 1fr; }
    .v3-offer .v3-scribble { margin-top: 4px; padding-top: 40px; padding-bottom: 0; }
    .v3-offer .v3-scribble-arrow--side { display: none; }
    .v3-offer .v3-scribble-arrow--up {
      display: block;
      left: 4px;
      top: 0;
      bottom: auto;
      width: 42px;
      height: 36px;
      transform: none;
    }
  }
</style>
