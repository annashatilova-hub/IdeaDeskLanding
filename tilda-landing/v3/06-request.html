<style>
  .v3-offer {
    --v3-ink: #1c1f22;
    --v3-muted: #5f6870;
    --v3-blue: #3669fd;
    --v3-blue-dark: #243046;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
    width: 100%;
    padding: 56px 20px 64px;
    font-family: 'TildaSans', Arial, sans-serif;
    color: var(--v3-ink);
    background: #e7eef8;
  }
  .v3-offer *, .v3-offer *::before, .v3-offer *::after { box-sizing: border-box; }
  .v3-offer-leaf {
    position: absolute;
    width: 180px;
    height: 180px;
    color: #c5d4ee;
    pointer-events: none;
  }
  .v3-offer-leaf svg { width: 100%; height: 100%; fill: currentColor; }
  .v3-offer-leaf--left { left: -40px; bottom: -50px; transform: rotate(20deg); }
  .v3-offer-leaf--right { right: -30px; top: -40px; transform: rotate(-30deg); }
  .v3-offer-grid {
    position: relative;
    z-index: 1;
    max-width: 1160px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 0.9fr 1.35fr 0.7fr;
    gap: 28px 32px;
    align-items: center;
  }
  .v3-offer .v3-kicker {
    display: block;
    margin: 0 0 12px;
    padding: 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #2e5ee8;
    background: none;
  }
  .v3-offer .v3-title {
    margin: 0 0 8px;
    font-size: clamp(26px, 3vw, 34px);
    line-height: 1.15;
    font-weight: 800;
    color: var(--v3-ink);
  }
  .v3-offer .v3-price {
    margin: 0 0 10px;
    font-size: clamp(28px, 3vw, 36px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--v3-ink);
  }
  .v3-offer .v3-price span { font-size: 0.55em; font-weight: 700; }
  .v3-offer .v3-note { margin: 0; max-width: 280px; font-size: 14px; line-height: 1.45; color: var(--v3-muted); }
  .v3-offer .v3-form {
    padding: 0;
    border-radius: 0;
    background: none;
    color: var(--v3-ink);
  }
  .v3-offer .v3-form h3 {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    color: var(--v3-muted);
  }
  .v3-offer .v3-fields {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  .v3-offer .v3-form input {
    width: 100%;
    min-height: 44px;
    margin: 0;
    padding: 11px 14px;
    font: inherit;
    font-size: 14px;
    color: var(--v3-ink);
    background: #fff;
    border: 1px solid #e3e8ef;
    border-radius: 8px;
  }
  .v3-offer .v3-btn {
    display: flex;
    width: min(100%, 220px);
    min-height: 44px;
    margin: 0 auto;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 8px;
    background: var(--v3-blue-dark);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .v3-offer .v3-scribble {
    position: relative;
    margin: 0;
    padding-bottom: 28px;
    font-family: 'Segoe Print', 'Comic Sans MS', cursive;
    font-size: 18px;
    line-height: 1.35;
    color: #3a4558;
  }
  .v3-offer .v3-scribble svg {
    position: absolute;
    left: 8px;
    bottom: -6px;
    width: 72px;
    height: 36px;
    stroke: #3a4558;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
  }
  @media (max-width: 900px) {
    .v3-offer-grid { grid-template-columns: 1fr; }
    .v3-offer .v3-fields { grid-template-columns: 1fr; }
  }
</style>

<section class="v3-offer" id="request">
  <div class="v3-offer-leaf v3-offer-leaf--left" aria-hidden="true">
    <svg viewBox="0 0 80 80"><path d="M10 70c20-4 28-22 30-40 8 10 22 16 34 14-8 16-24 28-44 30-8 1-16-1-20-4z"/></svg>
  </div>
  <div class="v3-offer-leaf v3-offer-leaf--right" aria-hidden="true">
    <svg viewBox="0 0 80 80"><path d="M70 10C50 14 42 32 40 50c-8-10-22-16-34-14 8 16 24 28 44 30 8 1 16-1 20-4z"/></svg>
  </div>
  <div class="v3-offer-grid">
    <div>
      <span class="v3-kicker">06 · Тарифы и заявка</span>
      <h2 class="v3-title">Вся платформа Idea Desk</h2>
      <div class="v3-price">20 000 ₽ <span>/ мес.</span></div>
      <p class="v3-note">Быстрый старт. Прозрачные условия. Поддержка на всех этапах.</p>
    </div>
    <form class="v3-form" onsubmit="event.preventDefault(); alert('Спасибо! Мы свяжемся с вами в ближайшее время.');">
      <h3>Оставьте заявку, чтобы подключить Idea Desk</h3>
      <div class="v3-fields">
        <input id="v3-name" name="name" autocomplete="name" placeholder="Ваше имя" required>
        <input id="v3-email" name="email" type="email" autocomplete="email" placeholder="E-mail" required>
        <input id="v3-phone" name="tel" type="tel" autocomplete="tel" placeholder="Телефон" required>
      </div>
      <button class="v3-btn" type="submit">Оставить заявку</button>
    </form>
    <p class="v3-scribble">Начните создавать коллекции, удобные уже сегодня.
      <svg viewBox="0 0 72 36" aria-hidden="true"><path d="M64 8c-18 2-32 8-46 18"/><path d="M18 20l-6 8 10-2"/></svg>
    </p>
  </div>
</section>
